<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fdfcf9">
<title>Siohuhu Studio</title>
<style>
@font-face {
  font-family: 'Sea of Mirrors 1.2';
  src:
    url('./fonts/Sea_of_Mirrors_1.2_SemiBold.woff2') format('woff2'),
    url('./fonts/Sea_of_Mirrors_1.2_SemiBold.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Sea of Mirrors 1.2';
  src:
    url('./fonts/Sea_of_Mirrors_1.2_Bold.woff2') format('woff2'),
    url('./fonts/Sea_of_Mirrors_1.2_Bold') format('opentype');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #fdfcf9;
  --text:   #2a2825;
  --muted:  #9a9590;
  --border: rgba(42,40,37,0.10);
  --sans: 'PingFang TC', 'Apple SD Gothic Neo', 'Noto Sans TC', sans-serif;
  --cjk-sans: 'PingFang TC', 'PingFang HK', 'Heiti TC', 'Hiragino Sans GB', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
  --panel: rgba(255,255,255,0.62);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', serif;
  min-height: 100svh;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 14px 24px;
}

.lang-switch {
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 10px;
}

.lang-switch button {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 7px 10px;
  font-family: var(--sans);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, opacity 0.2s;
}

body[data-lang="zh"] .lang-switch button {
  font-family: var(--cjk-sans);
  font-weight: 400;
}

.lang-switch button[aria-pressed="true"] {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

.lang-switch button:hover { opacity: 0.84; }

/* ══ HERO ══ */
.hero {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 3 / 4;
  border-radius: 16px;
  overflow: hidden;
  background: #9e9894;
  flex-shrink: 0;
}
.hero-img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 20%;
  display: block;
  position: relative;
  z-index: 0;
  animation: heroZoom 24s ease-in-out infinite;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.18) 100%
    ),

    linear-gradient(
      to bottom,
      transparent 25%,
      rgba(18,16,14,.55) 100%
    );
  pointer-events: none;
}
.hero::before {
  content: '';
  position: absolute;
  inset: -5%;
  z-index: 1;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.18),
      transparent 55%
    );
  animation: mistMove 18s ease-in-out infinite;
  pointer-events: none;
  will-change: transform;
}

@media (max-width: 719px) {
  .hero::before {
    inset: -10%;
    opacity: .75;
    background:
      radial-gradient(
        ellipse at 34% 42%,
        rgba(255,255,255,.16),
        transparent 48%
      ),
      radial-gradient(
        ellipse at 70% 34%,
        rgba(255,255,255,.09),
        transparent 52%
      );
    filter: blur(2px);
    animation-duration: 16s;
  }
}
@keyframes mistMove{
  0%{transform:translate3d(-18px, 0, 0) scale(1); opacity:.62; }
  50%{transform:translate3d(18px, -5px, 0) scale(1.015); opacity:.82; }
  100%{ transform:translate3d(-18px, 0, 0) scale(1); opacity:.62; }
}
@keyframes heroZoom {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.046); }
}

/* 左下文案 */
.hero-title {
  position: absolute;
  bottom: 18px; left: 18px;
  z-index: 20;
  color: rgba(255,255,255,0.95);
  font-family: 'Sea of Mirrors 1.2', serif;
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.72;
  pointer-events: none;
  max-width: 68%;
  font-size: 1.3rem;
}

body[data-lang="zh"] .hero-title {
  font-family: var(--cjk-sans);
  font-weight: 400;
  letter-spacing: 0.02em;
  font-size: 1.22rem;
}

@media (max-width: 390px) {
  .hero-title {
    font-size: 1.22rem;
    max-width: 68%;
  }

  body[data-lang="zh"] .hero-title {
    font-size: 1.14rem;
  }
}

/* ══ WORKS ══ */
.works { width: 100%; max-width: 420px; margin-top: 12px; }

.work-item {
  display: block; position: relative;
  overflow: hidden; text-decoration: none;
  border-radius: 10px; margin-bottom: 0;
}
.work-item .work-bg {
  width: 100%; height: 88px;
  object-fit: cover; object-position: center 40%;
  display: block;
  filter: brightness(0.72) saturate(0.88);
  transition: filter 0.4s, transform 0.4s;
}
.work-item:hover .work-bg {
  filter: brightness(0.58) saturate(0.80);
  transform: scale(1.04);
}
.work-item .work-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Sea of Mirrors 1.2',serif; font-weight: 500;
  font-size: clamp(1.4rem, 5.41vw, 1.78rem);
  letter-spacing: 0.36em;
  color: rgba(255,255,255,0.87);
  text-transform: none;
}

/* ══ BOTTOM BAR ══ */
.bottom-bar {
  width: 100%; max-width: 420px;
  display: flex;
  align-items: center;
  padding: 12px 0 0 12px;
  border-top: 0.5px solid var(--border);
  margin-top: 12px;
  gap: 12px;
  flex-shrink: 0;
}
.bottom-logo a {
  display: block; text-decoration: none; transition: opacity 0.25s;
}
.bottom-logo a:hover { opacity: 0.72; }
.bottom-logo img { height: 32px; width: auto; display: block; }

.bottom-divider {
  width: 0.5px; height: 32px;
  background: var(--border); flex-shrink: 0;
}
.bottom-contact .c-label {
  font-family: var(--sans);
  font-size: 0.68rem; font-weight: 300;
  letter-spacing: 0.12em; color: var(--text); margin-bottom: 0.2rem;
}

body[data-lang="zh"] .bottom-contact .c-label,
body[data-lang="zh"] .hero-bottom .hb-contact .c-label,
body[data-lang="zh"] footer {
  font-family: var(--cjk-sans);
  font-weight: 400;
}
.bottom-contact a {
  font-family: var(--sans);
  font-size: 0.62rem; font-weight: 300;
  letter-spacing: 0.04em; color: var(--muted);
  text-decoration: none; display: block; transition: color 0.2s;
}
.bottom-contact a:hover { color: var(--text); }

/* ══ SOCIAL ══ */
.social-bar {
  width: 100%; max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding: 12px 4px 0;
}
  .social-bar .social-icon {
    display: block; opacity: 0.50;
  }
  .social-bar img { width: 28px; height: 28px; object-fit: contain; display: block; }

/* ══ FOOTER ══ */
footer {
  width: 100%; max-width: 420px;
  padding: 10px 0 8px;
  text-align: center;
  font-family: var(--sans);
  font-size: 0.50rem; font-weight: 300;
  letter-spacing: 0.08em; color: var(--muted);
  border-top: 0.5px solid var(--border);
  margin-top: 10px;
}

/* hero-bottom：PC only */
.hero-bottom { display: none; }

/* ══════════════════
   PC  (≥ 720px)
══════════════════ */
@media (min-width: 720px) {
  html, body { height: auto; }
  body { padding: 40px 40px 0; background: #edeae4; }

  .hero {
    max-width: 1000px; width: 100%;
    aspect-ratio: 16 / 7; border-radius: 20px;
    flex: none;
  }

  .hero-title {
    bottom: 28px; left: 36px;
    font-size: clamp(1.38rem, 2.42vw, 1.89rem);
    max-width: 38%;
    letter-spacing: 0.06em;
    font-family: 'Sea of Mirrors 1.2', serif;
    font-weight: 600;
    line-height: 1.82;
  }

  body[data-lang="zh"] .hero-title {
    font-size: clamp(1.28rem, 2.22vw, 1.78rem);
    line-height: 1.74;
  }

  /* PC hero-bottom：logo+contact 在 works 下方 */
  .hero-bottom {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%; max-width: 1000px;
    padding: 20px 0 0;
    border-top: 0.5px solid var(--border);
    margin-top: 16px;
  }
  .hero-bottom .hb-logo a {
    display: block; text-decoration: none; transition: opacity 0.25s;
  }
  .hero-bottom .hb-logo a:hover { opacity: 0.72; }
  .hero-bottom .hb-logo img { height: 52px; width: auto; display: block; }
  .hero-bottom .hb-divider {
    width: 0.5px; height: 36px;
    background: var(--border); flex-shrink: 0;
  }
  .hero-bottom .hb-contact .c-label {
    font-family: var(--sans);
    font-size: 0.68rem; font-weight: 300;
    letter-spacing: 0.12em; color: var(--text); margin-bottom: 0.2rem;
  }
  .hero-bottom .hb-contact a {
    font-family: var(--sans);
    font-size: 0.62rem; font-weight: 300;
    color: var(--muted); text-decoration: none;
    display: block; transition: color 0.25s;
  }
  .hero-bottom .hb-contact a:hover { color: var(--text); }

  /* PC social：右側對齊 hero-bottom */
  .hero-bottom .hb-social {
    margin-left: auto;
    display: flex; gap: 12px; align-items: center;
  }
  .hero-bottom .hb-social .social-icon {
    display: block; opacity: 0.45;
    transition: opacity 0.2s;
  }
  .hero-bottom .hb-social img { width: 30px; height: 30px; object-fit: contain; }

  /* mobile bottom-bar / social 隱藏 */
  .bottom-bar { display: none; }
  .social-bar { display: none; }
  .lang-switch { max-width: 1000px; margin-bottom: 14px; }

  .works {
    max-width: 1000px;
    display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap;
  }
  .work-item { flex: 1; min-width: 260px; border-radius: 14px; }
  .work-item .work-bg { height: 150px; }
  .work-item .work-label { font-size: clamp(1.74rem, 2.96vw, 2.62rem); }

  footer {
    display: block; max-width: 1000px;
    padding: 1.2rem 0 2rem; font-size: 0.58rem;
    margin-top: 0;
  }
}

@media (min-width: 768px) and (max-width: 1024px) {
  .hero-title {
    font-size: clamp(1.36rem, 4.1vw, 1.68rem);
  }
}

/* 2K */
@media (min-width: 1800px) {
  body { padding: 56px 60px 0; }
  .hero { max-width: 1500px; aspect-ratio: 16 / 6; }
  .hero-title { font-size: clamp(1.43rem, 1.79vw, 1.98rem); bottom: 36px; left: 56px; }
  .hero-bottom { max-width: 1500px; }
  .hero-bottom .hb-logo img { height: 64px; }
  .works { max-width: 1500px; gap: 20px; }
  .work-item .work-bg { height: 200px; }
  .work-item .work-label { font-size: clamp(2.19rem, 2.74vw, 3.29rem); }
  footer { max-width: 1500px; font-size: 0.62rem; }
  .lang-switch { max-width: 1500px; }

  body[data-lang="zh"] .hero-title {
    font-size: clamp(1.34rem, 1.66vw, 1.82rem);
  }
}
</style>
</head>
<body>

  <nav class="lang-switch" aria-label="Language switch">
    <button type="button" data-set-lang="zh">中文</button>
    <button type="button" data-set-lang="en">EN</button>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <img class="hero-img" src="siohuhustudio_home.png" alt="Siohuhu Studio">
    <div class="hero-title" data-i18n="hero-copy" aria-hidden="true">
      Every journey <br>leaves a memory.<br>Every memory<br>awaits another traveler.
    </div>
  </section>

  <!-- WORKS -->
  <div class="works">
    <a class="work-item" href="https://siohuhu.github.io/sea-of-mirrors/" target="_blank" rel="noopener">
      <img class="work-bg" src="siohuhustudio_home02.png" alt="Sea of Mirrors 鏡之海">
      <span class="work-label" data-i18n="work-label">Sea of Mirrors</span>
    </a>
  </div>

  <!-- PC：logo + contact + social -->
    <div class="hero-bottom">
    <div class="hb-logo">
      <a href="./" aria-label="Siohuhu Studio">
        <img src="siohuhu_logo_02.png" alt="Siohuhu Studio">
      </a>
    </div>
    <div class="hb-divider"></div>
    <div class="hb-contact">
      <p class="c-label" data-i18n="contact-label">contact</p>
      <a href="mailto:hello@siohuhu.studio">hello@siohuhu.studio</a>
    </div>
    <div class="hb-social">
      <a class="social-icon" href="https://www.facebook.com/profile.php?id=61591777658771" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="fb.png" alt=""></a>
      <a class="social-icon" href="https://www.instagram.com/siohuhu.studio" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="ig.png" alt=""></a>
      <a class="social-icon" href="https://www.tiktok.com/@siohuhu?_r=1&_t=ZS-984mxpJN48z" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="Tik_Tok.png" alt=""></a>
    </div>
  </div>

  <!-- MOBILE：logo + contact -->
  <div class="bottom-bar">
    <div class="bottom-logo">
      <a href="./" aria-label="Siohuhu Studio">
        <img src="siohuhu_logo_02.png" alt="Siohuhu Studio">
      </a>
    </div>
    <div class="bottom-divider"></div>
    <div class="bottom-contact">
      <p class="c-label" data-i18n="contact-label">contact</p>
      <a href="mailto:hello@siohuhu.studio">hello@siohuhu.studio</a>
    </div>
  </div>

  <!---MOBILE social--->
  <div class="social-bar">
    <a class="social-icon" href="https://www.facebook.com/profile.php?id=61591777658771" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="fb.png" alt=""></a>
    <a class="social-icon" href="https://www.instagram.com/siohuhu.studio" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="ig.png" alt=""></a>
    <a class="social-icon" href="https://www.tiktok.com/@siohuhu?_r=1&_t=ZS-984mxpJN48z" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="Tik_Tok.png" alt=""></a>
  </div>

  <footer data-i18n="footer-copy">All rights reserved 2026 by The Siohuhu.Studio</footer>

  <script>
    (() => {
      const STORAGE_KEY = 'siohuhu-lang';
      const STRINGS = {
        zh: {
          'hero-copy': '每段旅程<br>都會留下記憶。<br>每段記憶<br>都在等下一位旅人。',
          'work-label': 'Sea of Mirrors',
          'contact-label': '聯絡',
          'footer-copy': '2026 The Siohuhu.Studio 版權所有',
          title: 'Siohuhu Studio',
        },
        en: {
          'hero-copy': 'Every journey<br>leaves a memory.<br>Every memory<br>awaits another traveler.',
          'work-label': 'Sea of Mirrors',
          'contact-label': 'Contact',
          'footer-copy': 'All rights reserved 2026 by The Siohuhu.Studio',
          title: 'Siohuhu Studio',
        }
      };

      const detectLanguage = () => {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'zh' || stored === 'en') return stored;
        const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'zh-TW'];
        return langs.some(lang => /^zh/i.test(lang)) ? 'zh' : 'en';
      };

      const setLanguage = (lang) => {
        const strings = STRINGS[lang] || STRINGS.en;
        document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
        document.title = strings.title;
        document.body.dataset.lang = lang;
        localStorage.setItem(STORAGE_KEY, lang);

        document.querySelectorAll('[data-i18n]').forEach((node) => {
          const key = node.dataset.i18n;
          const value = strings[key];
          if (typeof value === 'string') node.innerHTML = value;
        });

        document.querySelectorAll('[data-set-lang]').forEach((button) => {
          button.setAttribute('aria-pressed', button.dataset.setLang === lang ? 'true' : 'false');
        });
      };

      document.querySelectorAll('[data-set-lang]').forEach((button) => {
        button.addEventListener('click', () => setLanguage(button.dataset.setLang));
      });

      setLanguage(detectLanguage());
    })();
  </script>

</body>
</html>
