<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fdfcf9">
<meta name="robots" content="noindex, nofollow">
<title>Idioms - Siohuhu Studio</title>
<style>
@font-face {
  font-family: 'Sea of Mirrors 1.2';
  src:
    url('../fonts/Sea_of_Mirrors_1.2_SemiBold.woff2') format('woff2'),
    url('../fonts/Sea_of_Mirrors_1.2_SemiBold.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fdfcf9;
  --text: #2a2825;
  --muted: #8f8983;
  --border: rgba(42,40,37,0.10);
  --panel: rgba(255,255,255,0.66);
  --sans: 'PingFang TC', 'Apple SD Gothic Neo', 'Noto Sans TC', sans-serif;
  --cjk-sans: 'PingFang TC', 'PingFang HK', 'Heiti TC', 'Hiragino Sans GB', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100svh;
  font-family: var(--sans);
}

.page {
  position: relative;
  min-height: 100svh;
  padding: 16px 14px 24px;
  display: flex;
  flex-direction: column;
}

.lang-switch {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 10px;
}

.lang-switch button {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 7px 10px;
  font-family: var(--sans);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  cursor: pointer;
}

body[data-lang="zh"] .lang-switch button {
  font-family: var(--cjk-sans);
  font-weight: 400;
}

.lang-switch button[aria-pressed="true"] {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

.hero {
  position: relative;
  flex: 1;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  min-height: 70svh;
  background: #918b86;
}

.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 26%;
  filter: brightness(0.74) saturate(0.9);
  transform: scale(1.02);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to top, rgba(16,14,13,0.82) 0%, rgba(16,14,13,0.28) 45%, rgba(16,14,13,0.08) 100%);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 22px 18px;
  color: rgba(255,255,255,0.96);
}

.eyebrow {
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.74);
}

body[data-lang="zh"] .eyebrow,
body[data-lang="zh"] .title,
body[data-lang="zh"] .subtitle,
body[data-lang="zh"] .actions a.primary,
body[data-lang="zh"] .meta,
body[data-lang="zh"] .meta a {
  font-family: var(--cjk-sans);
}

body[data-lang="zh"] .title,
body[data-lang="zh"] .subtitle,
body[data-lang="zh"] .meta {
  font-weight: 400;
}

.title {
  font-family: 'Sea of Mirrors 1.2', serif;
  font-size: clamp(2rem, 8vw, 4.2rem);
  line-height: 0.95;
  letter-spacing: 0.02em;
}

.subtitle {
  max-width: 28rem;
  font-size: 0.92rem;
  line-height: 1.7;
  color: rgba(255,255,255,0.84);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 6px;
}

.actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.28);
  padding: 11px 14px;
  text-decoration: none;
  color: rgba(255,255,255,0.95);
  background: rgba(255,255,255,0.12);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  backdrop-filter: blur(6px);
}

.actions a.primary {
  background: rgba(255,255,255,0.18);
}

.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  width: 100%;
  max-width: 1000px;
  padding: 14px 2px 0;
  margin: 0 auto;
  color: var(--muted);
  font-size: 0.66rem;
  letter-spacing: 0.08em;
}

.meta a {
  color: inherit;
  text-decoration: none;
}

@media (min-width: 720px) {
  .page {
    padding: 40px 40px 24px;
  }

  .lang-switch {
    max-width: 1000px;
    margin: 0 auto 14px;
  }

  .hero {
    min-height: 72svh;
    max-width: 1000px;
    margin: 0 auto;
    border-radius: 20px;
  }

  .hero-content {
    padding: 32px 36px;
  }

  .title {
    font-size: clamp(3rem, 6vw, 5.5rem);
  }

  body[data-lang="zh"] .title {
    font-size: clamp(2.82rem, 5.7vw, 5.1rem);
  }
}
</style>
</head>
<body>
<div class="page">
  <nav class="lang-switch" aria-label="Language switch">
    <button type="button" data-set-lang="zh">中文</button>
    <button type="button" data-set-lang="en">EN</button>
  </nav>

  <section class="hero">
    <img src="../siohuhustudio_home02.png" alt="Idioms page cover">
    <div class="hero-content">
      <div class="eyebrow" data-i18n="eyebrow">Idioms</div>
      <h1 class="title" data-i18n="title">慣用語</h1>
      <p class="subtitle" data-i18n="subtitle">這個頁面正在整理中，之後會放入正式的慣用語內容。</p>
      <div class="actions">
        <a class="primary" href="../" data-i18n="back">回首頁</a>
        <a href="https://siohuhu.github.io/sea-of-mirrors/" target="_blank" rel="noopener" data-i18n="project">Sea of Mirrors</a>
      </div>
    </div>
  </section>

  <div class="meta">
    <span data-i18n="meta-left">Siohuhu Studio</span>
    <a href="mailto:hello@siohuhu.studio">hello@siohuhu.studio</a>
  </div>
</div>

<script>
  (() => {
      const STORAGE_KEY = 'siohuhu-lang';
      const STRINGS = {
        zh: {
        'eyebrow': '慣用語',
        'title': '慣用語',
        'subtitle': '這個頁面正在整理中，之後會放入正式的慣用語內容。',
        'back': '回首頁',
        'project': 'Sea of Mirrors',
        'meta-left': 'Siohuhu Studio',
      },
      en: {
        'eyebrow': 'Idioms',
        'title': 'Idioms',
        'subtitle': 'This page is being prepared and will hold the full idiom content.',
        'back': 'Home',
        'project': 'Sea of Mirrors',
        'meta-left': 'Siohuhu Studio',
      }
    };

    const detectLanguage = () => {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'zh' || stored === 'en') return stored;
      const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'zh-TW'];
      return langs.some(lang => /^zh/i.test(lang)) ? 'zh' : 'en';
    };

    const setLanguage = (lang) => {
      const strings = STRINGS[lang] || STRINGS.en;
      document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
      document.body.dataset.lang = lang;
      localStorage.setItem(STORAGE_KEY, lang);

      document.querySelectorAll('[data-i18n]').forEach((node) => {
        const value = strings[node.dataset.i18n];
        if (typeof value === 'string') node.textContent = value;
      });

      document.querySelectorAll('[data-set-lang]').forEach((button) => {
        button.setAttribute('aria-pressed', button.dataset.setLang === lang ? 'true' : 'false');
      });
    };

    document.querySelectorAll('[data-set-lang]').forEach((button) => {
      button.addEventListener('click', () => setLanguage(button.dataset.setLang));
    });

    setLanguage(detectLanguage());
  })();
</script>
</body>
</html>
